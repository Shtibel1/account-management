version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Inject environment variables from Amplify console into .env.production for Next.js SSR / API routes
        - echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> .env.production
        - echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env.production
        - echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env.production
        # Public site origin for auth redirects and invite emails (src/lib/siteUrl.ts). Set it per branch:
        # behind Amplify the request URL is https://localhost:3000.
        - echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" >> .env.production
        # Fallback allow-list host <branch>.<appId>.amplifyapp.com for X-Forwarded-Host (src/lib/siteUrl.ts)
        - echo "SITE_AMPLIFY_APP_ID=$AWS_APP_ID" >> .env.production
        - echo "SITE_AMPLIFY_BRANCH=$AWS_BRANCH" >> .env.production
        - echo "GOOGLE_CLOUD_API_KEY=$GOOGLE_CLOUD_API_KEY" >> .env.production
        - echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env.production
        # Secret of the scheduled processing worker (/api/invoices/worker); see docs/ingestion.md
        - echo "PROCESSING_WORKER_SECRET=$PROCESSING_WORKER_SECRET" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
